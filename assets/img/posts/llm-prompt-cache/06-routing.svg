<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">经 OpenRouter 时缓存落在哪里</title>
  <desc id="desc">OpenRouter 按会话粘性路由到托管方。用户 A 和用户 B 的会话 1 落到托管方 1，可以共享公共段；用户 B 的会话 2 落到托管方 2，读不到托管方 1 的缓存。</desc>
  <rect x="0.5" y="0.5" width="759" height="219" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#9ca3af"/></marker>
  </defs>
  <g font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" fill="#111827">
    <g fill="none" stroke="#9ca3af" stroke-width="1.25" marker-end="url(#arrow)">
      <path d="M164 48 H210 L230 76"/>
      <path d="M164 110 H230"/>
      <path d="M164 172 H210 L230 144"/>
      <path d="M390 68 H425 V40 H470"/>
      <path d="M390 93 H443 V56 H470"/>
      <path d="M390 138 H425 V110 H470"/>
    </g>
    <g font-size="12" fill="#6b7280"><text x="397" y="61">A</text><text x="397" y="86">B1</text><text x="397" y="131">B2</text></g>
    <g font-size="14" text-anchor="middle">
      <rect x="20" y="32" width="144" height="32" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="92" y="53">用户 A 的会话</text>
      <rect x="20" y="94" width="144" height="32" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="92" y="115">用户 B 的会话 1</text>
      <rect x="20" y="156" width="144" height="32" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="92" y="177">用户 B 的会话 2</text>
      <rect x="230" y="40" width="160" height="140" rx="6" fill="#ffffff" stroke="#9ca3af"/>
      <text x="310" y="87" font-weight="600">OpenRouter</text>
      <g font-size="12" fill="#6b7280"><text x="310" y="113">按会话 ID 粘性路由</text><text x="310" y="133">新会话按份额挑一家</text></g>
      <rect x="470" y="20" width="98" height="56" rx="6" fill="#ffffff" stroke="#9ca3af"/><text x="519" y="39">托管方 1</text>
      <rect x="481" y="46" width="76" height="22" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="519" y="62" font-size="12" fill="#166534">缓存</text>
      <rect x="470" y="82" width="98" height="56" rx="6" fill="#ffffff" stroke="#9ca3af"/><text x="519" y="101">托管方 2</text>
      <rect x="481" y="108" width="76" height="22" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="519" y="124" font-size="12" fill="#6b7280">缓存</text>
      <rect x="470" y="144" width="98" height="56" rx="6" fill="#ffffff" stroke="#9ca3af"/><text x="519" y="163">托管方 3</text>
      <rect x="481" y="170" width="76" height="22" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="519" y="186" font-size="12" fill="#6b7280">缓存</text>
    </g>
    <g font-size="12"><text x="580" y="52" fill="#166534">A 存下的公共段，B1 能读到</text><text x="580" y="114" fill="#6b7280">B2 落到这里：读不到</text></g>
  </g>
</svg>
